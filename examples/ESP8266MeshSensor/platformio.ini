#
# Example PlatformIO configuration file for SSL and non-SSL builds.
#
# Before you will be able to build the SSL version of this project, you will
# need to explicitly install the espressif8266_stage platform.
#
# To perform this installation, refer to step 1 of:
# http://docs.platformio.org/en/latest/platforms/espressif8266.html#using-arduino-framework-with-staging-version

[platformio]
default_envs = sonoffmini_switch, sonoffbasic, sonoffmini_orig, sonoffmini_heater, sonoffbasic_freezer

[env]
framework = arduino
lib_deps = 
	https://github.com/skudi/ESP8266MQTTMesh.git
	HLW8012
	DallasTemperature
	platformio/toolchain-xtensa
	platformio/framework-arduinoespressif8266
	platformio/tool-esptool

[env:esp32]
platform = espressif32
board = esp32cam
build_flags = 
	-g
	-DSTATUS_LED=4
	-DEMMDBG_LEVEL=EMMDBG_ALL

[env:sonoffmini_switch]
platform = espressif8266@~1.6.0
board = esp8285
upload_protocol = esptool
build_flags =
	-DFIRMWARE_ID=0x6701
	-DBUTTON=4
	-DDS18B20=0
	-DSTATUS_LED=13
	-DEMMDBG_LEVEL=EMMDBG_ALL
	-DBISTATEBUTTON=1
	-DRELAYGPIO=12
	-DRELAYONVAL=0

[env:sonoffmini_heater]
platform = espressif8266@~1.6.0
board = esp8285
upload_protocol = esptool
build_flags =
	-DFIRMWARE_ID=0x6703
	-DDS18B20=0
	-DSTATUS_LED=13
	-DEMMDBG_LEVEL=EMMDBG_ALL
	-DBISTATEBUTTON=1
	-DRELAY0GPIO=12
	-DRELAY0ONVAL=1
	-DRELAY1GPIO=16
	-DRELAY1ONVAL=1
	-DRELAY2GPIO=4
	-DRELAY2ONVAL=1

[env:sonoffmini_orig]
platform = espressif8266@~1.6.0
board = esp8285
upload_protocol = esptool
build_flags =
	-DDS18B20=0
	-DSTATUS_LED=13
	-DEMMDBG_LEVEL=EMMDBG_ALL

[env:sonoffbasic]
platform = espressif8266@~1.6.0
board = esp8285
upload_protocol = esptool
build_flags =
	-DFIRMWARE_ID=0x6701
	-DDS18B20=0
	-DSTATUS_LED=13
	-DEMMDBG_LEVEL=EMMDBG_ALL

# sonoff basic old PCB with gpio2 on 5 pin header
# onewire on gpio0
[env:sonoffbasicv0_heater]
platform = espressif8266@~1.6.0
board = esp8285
upload_protocol = esptool
build_flags =
	-DFIRMWARE_ID=0x6704
	-DDS18B20=0
	-DSTATUS_LED=13
	-DEMMDBG_LEVEL=EMMDBG_ALL
	-DBISTATEBUTTON=1
	-DRELAY0GPIO=12
	-DRELAY0ONVAL=1
	-DRELAY1GPIO=2
	-DRELAY1ONVAL=0

[env:sonoffbasic_freezer]
platform = espressif8266@~1.6.0
board = esp8285
upload_protocol = esptool
build_flags =
	-DFIRMWARE_ID=0x6702
	-DDS18B20=0
	-DFREEZER=1
	-DRELAYGPIO=14
	-DRELAYONVAL=0
	-DTEMPMIN=-16.00
	-DTEMPMAX=-15.00
	-DSTATUS_LED=13
	-DEMMDBG_LEVEL=EMMDBG_ALL
