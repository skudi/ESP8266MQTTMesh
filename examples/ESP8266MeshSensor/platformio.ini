#
# Example PlatformIO configuration file for SSL and non-SSL builds.
#
# Before you will be able to build the SSL version of this project, you will
# need to explicitly install the espressif8266_stage platform.
#
# To perform this installation, refer to step 1 of:
# http://docs.platformio.org/en/latest/platforms/espressif8266.html#using-arduino-framework-with-staging-version

[platformio]
default_envs = sonoffmini_switch, sonoffbasic, sonoffmini_heater, sonoffbasic_freezer, sonoffbasicv0_heater

[env]
framework = arduino
lib_deps = 
	https://github.com/skudi/ESP8266MQTTMesh.git
	HLW8012
	DallasTemperature
monitor_speed = 115200

[env:esp32]
platform = espressif32
board = esp32cam
build_flags = 
	-g
	-DFIRMWARE_ID=0x7101
	-DSTATUS_LED=4

[env:sonoffmini_switch]
platform = espressif8266@~1.6.0
board = esp8285
upload_protocol = esptool
build_flags =
	-DFIRMWARE_ID=0x6701
	-DBUTTON=4
	-DDS18B20=0
	-DSTATUS_LED=13
	-DBISTATEBUTTON=1
	-DRELAY0GPIO=12
	-DRELAY0ONVAL=0

[env:sonoffmini_heater]
platform = espressif8266@~1.6.0
board = esp8285
upload_protocol = esptool
build_flags =
	-DFIRMWARE_ID=0x6703
	-DDS18B20=0
	-DSTATUS_LED=13
	-DBISTATEBUTTON=1
	-DRELAY0GPIO=12
	-DRELAY0ONVAL=1
	-DRELAY1GPIO=16
	-DRELAY1ONVAL=1
	-DRELAY2GPIO=4
	-DRELAY2ONVAL=1

#valid for sonoffmini and sonoffbasic
[env:sonoffbasic]
platform = espressif8266@~1.6.0
board = esp8285
upload_protocol = esptool
build_flags =
	-DFIRMWARE_ID=0x6705
	-DRELAY0GPIO=12
	-DRELAY0ONVAL=1
	-DSTATUS_LED=13

# sonoff basic old PCB with gpio2 on 5 pin header
# onewire on gpio0
[env:sonoffbasicv0_heater]
platform = espressif8266@~1.6.0
board = esp8285
upload_protocol = esptool
build_flags =
	-DFIRMWARE_ID=0x6704
	-DDS18B20=0
	-DSTATUS_LED=13
	-DBISTATEBUTTON=1
	-DRELAY0GPIO=12
	-DRELAY0ONVAL=1
	-DRELAY1GPIO=2
	-DRELAY1ONVAL=0

[env:sonoffbasic_freezer]
platform = espressif8266@~1.6.0
board = esp8285
upload_protocol = esptool
build_flags =
	-DFIRMWARE_ID=0x6702
	-DDS18B20=0
	-DFREEZER=1
	-DRELAY0GPIO=14
	-DRELAY0ONVAL=0
	-DTEMPMIN=-16.00
	-DTEMPMAX=-15.00
	-DSTATUS_LED=13

##########################################################################
#płytka z aliexpress lista pinów (nazwy na płytce przy pinach)
#1.  GND: power ground
#2.  Relay: IO5 jest domyślnie używany. Jeśli chcesz użyć innego IO do napędzania przekaźnika, możesz usunąć R14, a następnie podłączyć I/O przekaźnika napędu do tego sworznia przekaźnika
#3.  IO2: GPIO2: UARTI-TXD; Blue LED on esp8266 module
#4.  IO4: GPIO4
#5.  RX: UARTO-RXD: GPIO3
#6.  3V3: zasilanie 3.3V
#7.  SCLK: zegar
#8.  IO15: GPIO15: MTDO; HSPICS; UARTO-RTS
#9.  IO0: GPIO0
#10. IO5: GPIO5
#11. TX: UARTO-TXD; GPIO1
#12. 5V: zasilanie 5V
#13. IO10: GPIO10
#14. MISO: wyjście Slave i wejście hosta
#15. IO13: GPIO13; HSPI-MOSI; UARTO-CTS
#16. IO14: GPIO14; HSPI-CLK
#17. ADC: wynik konwersji A/D. Zakres napięcia wejściowego: 0 ~ 1V, zakres wartości: 0 ~ 1024
#18. 3V3: zasilanie 3.3V
#19. MOSI: wyjście hosta i wejście slave
#20. IO9: GPIO9  (NIE UŻYWAĆ!)
#21. CSO: wybór układu
#22. IO12: GPIO12; HSPI-MISO
#23. IO16: GPIO16; programmable LED)
#24. GND: power ground
[env:esp12frelayx1v12_relay]
platform = espressif8266@~1.6.0
board = esp12e
upload_protocol = esptool
build_flags =
	-DFIRMWARE_ID=0x6801
	-DDS18B20=0
	-DRELAY0GPIO=05
	-DRELAY0ONVAL=1
	-DRELAY1GPIO=02
	-DRELAY1ONVAL=0
	-DRELAY2GPIO=04
	-DRELAY2ONVAL=0
	-DRELAY3GPIO=10
	-DRELAY3ONVAL=0
	-DRELAY4GPIO=12
	-DRELAY4ONVAL=0
	-DRELAY5GPIO=13
	-DRELAY5ONVAL=0
	-DRELAY6GPIO=14
	-DRELAY6ONVAL=0
	-DRELAY7GPIO=15
	-DRELAY7ONVAL=0
	-DTEMPMIN=50.00
	-DTEMPMAX=60.00
	-DSTATUS_LED=16

